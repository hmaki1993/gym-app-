<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Preload Critical Dashboard Assets for Instant Paint -->
    <link rel="preload" as="image" href="/assets/stopwatch-ultra-clean-v3.png" />
    <link rel="preload" as="image" href="/assets/stopwatch-ultra-clean-v3-light.png" />
    <link rel="preload" as="image" href="/assets/stopwatch-stop.png" />
    <link rel="preload" as="image" href="/assets/stopwatch-stop-light.png" />
    <link rel="preload" as="image" href="/assets/flame-custom.png" />
    <link rel="preload" as="image" href="/assets/calendar-custom.png" />
    <link rel="preload" as="image" href="/assets/clock-custom.png" />
    <link rel="preload" as="image" href="/assets/start-first-training.png" />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Synchronously apply theme before paint to prevent dark mode startup flash in Light Mode
      (function() {
        try {
          const raw = localStorage.getItem('gymlog_state_v1');
          let theme = 'system';
          if (raw) {
            const parsed = JSON.parse(raw);
            theme = parsed?.settings?.themeMode || 'system';
          }
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
          
          // Apply initial background color immediately to prevent white flash
          const bg = theme === 'light' ? '#f6f7f9' : '#0a0a0c';
          const style = document.createElement('style');
          style.id = 'theme-initial-bg';
          style.innerHTML = `html, body { background: ${bg} !important; }`;
          document.head.appendChild(style);
          
          const themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) {
            themeMeta.setAttribute('content', bg);
          }
        } catch (e) {
          console.error('Theme detection failed', e);
        }
      })();

      // Clear Service Workers and Caches to force update from APK assets
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          for(let r of regs) r.unregister();
        });
      }
      if (window.caches) {
        caches.keys().then(names => {
          for (let n of names) caches.delete(n);
        });
      }

      // App Skeleton for INSTANT "Rocket" Startup
      if (!window.location.search.includes('floating=true')) {
        document.addEventListener('DOMContentLoaded', () => {
          const root = document.getElementById('root');
          if (root) {
            const raw = localStorage.getItem('gymlog_state_v1');
            let theme = 'system';
            try {
              if (raw) theme = JSON.parse(raw)?.settings?.themeMode || 'system';
            } catch(e) {}
            if (theme === 'system') {
              theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            
            const isLight = theme === 'light';
            const stopwatchSrc = isLight ? "/assets/stopwatch-ultra-clean-v3-light.png" : "/assets/stopwatch-ultra-clean-v3.png";
            const dropShadow = isLight ? 'drop-shadow(0 6px 12px rgba(0,0,0,0.08))' : 'drop-shadow(0 8px 16px rgba(0,0,0,0.3))';
            
            root.innerHTML = `
              <div id="startup-skeleton" style="display:flex;flex-direction:column;width:100vw;height:100dvh;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top);background:${isLight ? '#f6f7f9' : '#0a0a0c'};">
                <img src="${stopwatchSrc}" style="width:100%;max-width:230px;height:auto;object-fit:contain;filter:${dropShadow};" />
              </div>
            `;
          }
        });
      }
    </script>
    <title>Power Grid — Elite Training System</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/Green_Illustrative_Gym___Fitness_Logo__1_-removebg-preview.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/Green_Illustrative_Gym___Fitness_Logo__1_-removebg-preview.png" />
    <meta name="apple-mobile-web-app-title" content="PowerGrid" />
    <meta name="description" content="Track your gym workouts, sets, weights, and personal records. Offline-first training tracker." />
    <style>
      html, body {
        overscroll-behavior: none !important;
        overscroll-behavior-x: none !important;
        overscroll-behavior-y: none !important;
        touch-action: pan-y;
      }
    </style>
  </head>
  <body style="overscroll-behavior:none;overflow:hidden;">
    <div id="scanner-root"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
